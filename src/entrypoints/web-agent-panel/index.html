<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Agent</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1c1d;
        color: #e3e3e3;
        font: 12px/1 system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: none;
        height: 32px;
        padding: 0 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      #toolbar button {
        height: 22px;
        padding: 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 11px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #toolbar button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      #toolbar button:focus-visible {
        outline: 2px solid #8ab4f8;
        outline-offset: 1px;
      }
      #status {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        opacity: 0.7;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #fff;
          color: #1f1f1f;
        }
        #toolbar {
          border-bottom-color: rgba(0, 0, 0, 0.08);
        }
        #toolbar button {
          border-color: rgba(0, 0, 0, 0.16);
        }
        #toolbar button:hover {
          background: rgba(0, 0, 0, 0.05);
        }
        #toolbar button:focus-visible {
          outline-color: #0b57d0;
        }
      }
      iframe {
        display: block;
        flex: 1;
        min-height: 0;
        border: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="toolbar" role="toolbar" aria-label="Web Agent tabs">
      <button id="add-active" type="button"></button>
      <button id="add-all" type="button"></button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
